<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Click Battle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g' cx='35%25' cy='35%25'><stop offset='0' stop-color='%239ee9ff'/><stop offset='0.5' stop-color='%2300a8ff'/><stop offset='1' stop-color='%23003a7a'/></radialGradient></defs><circle cx='16' cy='16' r='14' fill='url(%23g)'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at top,#091123 0%,#02030a 55%,#03020f 100%);overflow:hidden;font-family:-apple-system,'Segoe UI',sans-serif;color:#f7f7ff;height:100vh;user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.sphere{position:absolute;z-index:20;width:36px;height:36px;border-radius:50%;will-change:transform,left,top;transition:transform .06s ease-out;pointer-events:none}
.sphere.hit{transform:scale(1.3)}
.sphere .lbl{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:1px;color:rgba(255,255,255,0.9);text-shadow:0 1px 4px rgba(0,0,0,0.9);white-space:nowrap;text-align:center;font-weight:600}
.sphere .scr{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.9)}
#ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;pointer-events:none;overflow-y:auto}
#ui>*{pointer-events:auto}
h1{font-size:44px;letter-spacing:5px;color:#f8f8ff;text-shadow:0 0 14px #00a8ff,0 0 36px #0066cc;animation:pulse 3s ease-in-out infinite;margin-bottom:4px;text-align:center}
h2{font-size:22px;letter-spacing:3px;color:#fff;text-shadow:0 0 10px #00a8ff;margin-bottom:10px;text-align:center}
@keyframes pulse{0%,100%{text-shadow:0 0 14px #00a8ff,0 0 32px #00a8ff}50%{text-shadow:0 0 22px #00a8ff,0 0 56px #0066cc}}
.tag{color:rgba(255,255,255,0.55);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;text-align:center;max-width:320px}
input,button{font-family:inherit}
input{padding:9px 16px;font-size:14px;border:1.5px solid rgba(0,168,255,0.4);border-radius:22px;background:rgba(0,10,20,0.6);color:#fff;text-align:center;outline:none;width:230px;margin-bottom:8px;transition:border-color .2s,box-shadow .2s}
input.code{font-size:18px;letter-spacing:8px;text-transform:uppercase;font-weight:bold;padding:10px}
input:focus{border-color:#00a8ff;box-shadow:0 0 12px rgba(0,168,255,0.3)}
.btn{padding:10px 22px;font-size:14px;font-weight:bold;letter-spacing:2px;border:1.5px solid rgba(0,168,255,0.5);border-radius:22px;background:rgba(8,12,24,0.75);color:#fff;cursor:pointer;width:230px;margin-bottom:6px;transition:transform .15s,border-color .2s,box-shadow .2s}
.btn:hover{transform:scale(1.04);border-color:#00a8ff;box-shadow:0 0 16px rgba(0,168,255,0.3)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn.ghost{border-color:rgba(255,255,255,0.2);font-size:12px;padding:8px 18px}
.btn.ghost:hover{border-color:rgba(255,255,255,0.5);box-shadow:none}
.modes{display:flex;gap:6px;margin-bottom:8px;width:230px}
.mode{flex:1;padding:9px 6px;font-size:11px;font-weight:bold;letter-spacing:2px;border-radius:18px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(10,14,32,0.8);color:rgba(255,255,255,0.9);cursor:pointer;transition:all .2s}
.mode:hover{border-color:rgba(0,168,255,0.45)}
.mode.active{border-color:#00a8ff;background:rgba(0,168,255,0.14);color:#fff}
.panel{width:min(300px,92vw);background:rgba(6,10,24,0.8);border:1px solid rgba(0,168,255,0.18);border-radius:14px;padding:10px 12px;margin-top:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel h3{font-size:10px;color:#00a8ff;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:7px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:rgba(255,255,255,0.85);gap:7px;align-items:center}
.row.me{color:#00e0ff;font-weight:bold;text-shadow:0 0 6px rgba(0,168,255,0.5)}
.row .rank{width:18px;color:rgba(255,255,255,0.4);flex-shrink:0;font-size:11px}
.row .name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{font-size:8px;letter-spacing:1px;padding:1px 5px;border-radius:5px;background:rgba(0,168,255,0.15);color:#7ed4ff;text-transform:uppercase;flex-shrink:0}
.row .mt.space{background:rgba(255,180,80,0.15);color:#ffc070}
.row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.row .code-mini{font-size:10px;letter-spacing:2px;font-weight:bold;color:#00e0ff;background:rgba(0,168,255,0.1);padding:2px 6px;border-radius:6px;flex-shrink:0}
.row .count{font-size:11px;color:rgba(255,255,255,0.55);flex-shrink:0}
.join-btn{padding:4px 10px;font-size:10px;font-weight:bold;letter-spacing:1.5px;border:1px solid rgba(0,168,255,0.5);border-radius:10px;background:rgba(0,168,255,0.1);color:#00e0ff;cursor:pointer;flex-shrink:0;font-family:inherit;transition:background .15s}
.join-btn:hover:not(:disabled){background:rgba(0,168,255,0.3);color:#fff}
.join-btn:disabled{opacity:0.3;cursor:not-allowed;color:rgba(255,255,255,0.4);border-color:rgba(255,255,255,0.2);background:transparent}
.empty{color:rgba(255,255,255,0.4);text-align:center;padding:5px;font-size:11px}
.code-disp{font-size:30px;letter-spacing:10px;font-weight:bold;color:#00e0ff;text-shadow:0 0 14px rgba(0,168,255,0.6);margin:4px 0 12px;padding:8px 12px;background:rgba(0,168,255,0.06);border:1px dashed rgba(0,168,255,0.4);border-radius:12px;text-align:center}
.status{font-size:11px;color:rgba(255,255,255,0.55);letter-spacing:2px;text-transform:uppercase;margin-top:4px;text-align:center}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 22px;z-index:15;display:none;justify-content:space-between;font-size:22px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px rgba(0,168,255,0.7);pointer-events:none}
#hud .label{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:3px;text-transform:uppercase;display:block;margin-bottom:1px;font-weight:normal;text-shadow:none}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.45);font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:15;display:none;pointer-events:none;text-align:center}
.hide{display:none!important}
.pop{position:fixed;z-index:25;color:#00e0ff;font-size:15px;font-weight:bold;text-shadow:0 0 6px #00a8ff;pointer-events:none;animation:floatUp .55s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-46px);opacity:0}}
#count{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:bold;color:#fff;text-shadow:0 0 30px #00a8ff,0 0 60px #0066cc;pointer-events:none;z-index:30;display:none}
.back{position:fixed;top:14px;left:14px;z-index:40;background:rgba(8,12,24,0.7);border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.7);border-radius:18px;padding:5px 12px;font-size:11px;cursor:pointer;letter-spacing:2px;font-weight:bold;display:none}
.back:hover{color:#fff;border-color:#00a8ff}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button class="back" id="back">← BACK</button>
<div id="spheres"></div>
<div id="count"></div>
<div id="hud"><div><span class="label">Time</span><span id="time">10.0</span></div><div><span class="label">Score</span><span id="score">0</span></div></div>
<div id="hint"></div>
<div id="ui">
  <div id="menu">
    <h1>CLICK BATTLE</h1>
    <p class="tag">10 seconds. Spam to launch your sphere. Beat the board.</p>
    <input id="name" placeholder="Your name" maxlength="14" autofocus>
    <div class="modes"><button class="mode active" id="modeMouse">MOUSE</button><button class="mode" id="modeSpace">SPACEBAR</button></div>
    <button class="btn" id="start">SOLO</button>
    <button class="btn" id="mpBtn">MULTIPLAYER · UP TO 4P</button>
    <div class="panel"><h3>Top 10 — This Browser</h3><div id="board"></div></div>
  </div>
  <div id="mpMenu" class="hide">
    <h1>MULTIPLAYER</h1>
    <p class="tag">Create a room, join one below, or use a 4-char code.</p>
    <input id="mpName" placeholder="Your name" maxlength="14">
    <input id="mpRoomName" placeholder="Room name (optional)" maxlength="20">
    <button class="btn" id="createBtn">CREATE ROOM</button>
    <input id="codeInput" class="code" placeholder="CODE" maxlength="4">
    <button class="btn" id="joinBtn">JOIN BY CODE</button>
    <div id="mpError" class="status" style="color:#ff7070;min-height:14px"></div>
    <div class="panel"><h3>Live Rooms <span id="roomRefreshHint" style="opacity:0.4;font-size:9px;letter-spacing:1px">· auto-refresh</span></h3><div id="roomBrowser"><div class="empty">Loading…</div></div></div>
  </div>
  <div id="lobby" class="hide">
    <h2>ROOM</h2>
    <div class="code-disp" id="lobbyCode">----</div>
    <div class="panel" style="margin-top:0"><h3>Players · <span id="lobbyCount">0</span>/4</h3><div id="lobbyList"></div></div>
    <button class="btn" id="hostStart" style="margin-top:14px;display:none">START GAME</button>
    <div class="status" id="hostHint" style="display:none">Waiting for host…</div>
  </div>
  <div id="over" class="hide">
    <h1 id="finalText">0</h1>
    <p class="tag" id="resultTag">CLICKS · MOUSE</p>
    <button class="btn" id="again">PLAY AGAIN</button>
    <button class="btn ghost" id="overBack">BACK TO MENU</button>
    <div class="panel"><h3 id="overTitle">Live Leaderboard</h3><div id="board2"></div></div>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const bg = $('bg'), bctx = bg.getContext('2d'), hud = $('hud'), count = $('count'), hint = $('hint'), spheresEl = $('spheres');
const COLORS = ['#00a8ff', '#ff5577', '#ffd84d', '#5eff9a'];
// Physics (world units; +worldY = up). Each click pushes vy upward; gravity always drags toward 0.
const R = 18, GRAVITY = 380, BOOST = 55, VY_MAX = 650;
const GROUND_PAD = 60, HEAD_PAD = 90;
let stars = [], W = 0, H = 0, t = 0, running = false;
let viewWorldY = 0, prevView = 0; // camera "bottom of view" in world units
let mode = localStorage.getItem('cb_mode') || 'mouse';
let view = 'menu', isMP = false, myId = null, ws = null;
const players = new Map(); // id → {id,name,color,slot,score,worldY,vy,x,el,scrEl,hitT,isMe}

function resize() {
  W = bg.width = innerWidth; H = bg.height = innerHeight;
  if (!stars.length) for (let i = 0; i < 180; i++) stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+0.3, d:0.3+Math.random()*0.7, p:Math.random()*6.28});
  for (const p of players.values()) p.x = sphereX(p.slot);
}
addEventListener('resize', resize); resize();

function sphereX(slot) { return isMP ? W * (slot * 2 + 1) / 8 : W / 2; }

function updateCamera() {
  let maxY = 0;
  for (const p of players.values()) if (p.worldY > maxY) maxY = p.worldY;
  const target = Math.max(0, maxY - (H - GROUND_PAD - HEAD_PAD));
  viewWorldY += (target - viewWorldY) * 0.18;
}

function drawBg(dt) {
  const viewDelta = viewWorldY - prevView; prevView = viewWorldY;
  bctx.fillStyle = 'rgba(2,4,10,0.30)'; bctx.fillRect(0, 0, W, H);
  // Stars: ambient slow downward drift + parallax based on camera scroll
  for (const s of stars) {
    s.y += 26 * s.d * dt + viewDelta * s.d;
    while (s.y > H + 10) { s.y -= H + 20; s.x = Math.random() * W; }
    while (s.y < -10)    { s.y += H + 20; s.x = Math.random() * W; }
    s.p += dt * 2;
    bctx.fillStyle = `rgba(150,210,255,${(0.2+0.6*Math.abs(Math.sin(s.p)))*(0.5+s.d*0.5)})`;
    bctx.beginPath(); bctx.arc(s.x, s.y, s.r*(0.4+s.d*0.8), 0, 6.283); bctx.fill();
  }
  // Ground line — visible when camera near floor
  const groundY = H - GROUND_PAD + viewWorldY;
  if (groundY > -4 && groundY < H + 4) {
    bctx.strokeStyle = 'rgba(0,168,255,0.35)';
    bctx.lineWidth = 1.5;
    bctx.beginPath(); bctx.moveTo(0, groundY); bctx.lineTo(W, groundY); bctx.stroke();
  }
}

function makeSphereEl(p) {
  const el = document.createElement('div');
  el.className = 'sphere';
  el.style.background = `radial-gradient(circle at 32% 30%,#fff,${p.color} 45%,#001a3a)`;
  el.style.boxShadow = `0 0 18px ${p.color},0 0 38px ${p.color}66,inset -5px -5px 12px rgba(0,0,0,0.45)`;
  el.innerHTML = `<div class="lbl">${esc(p.name)}</div><div class="scr">0</div>`;
  spheresEl.appendChild(el);
  p.el = el; p.scrEl = el.querySelector('.scr');
}
function clearSpheres() { spheresEl.innerHTML = ''; for (const p of players.values()) { p.el = null; p.scrEl = null; } }
function pulse(p) { if (!p.el) return; p.el.classList.add('hit'); clearTimeout(p.hitT); p.hitT = setTimeout(() => p.el && p.el.classList.remove('hit'), 70); }

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (running) {
    for (const p of players.values()) {
      p.vy -= GRAVITY * dt; // gravity always pulls upward velocity down
      if (p.vy > VY_MAX) p.vy = VY_MAX;
      if (p.vy < -VY_MAX) p.vy = -VY_MAX;
      p.worldY += p.vy * dt;
      if (p.worldY < 0) { p.worldY = 0; if (p.vy < 0) p.vy = 0; }
    }
    t -= dt;
    if (t <= 0) { t = 0; end(); }
    else $('time').textContent = t.toFixed(1);
  }
  updateCamera();
  drawBg(dt);
  for (const p of players.values()) {
    if (!p.el) continue;
    const sy = H - GROUND_PAD - (p.worldY - viewWorldY);
    p.el.style.left = (p.x - R) + 'px';
    if (sy > H - 6) {
      p.el.style.top = (H - 28) + 'px';
      p.el.style.opacity = '0.45';
    } else {
      p.el.style.top = (sy - R) + 'px';
      p.el.style.opacity = '1';
    }
    if (p.scrEl) p.scrEl.textContent = p.score;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function localClick() {
  if (!running) return;
  const me = players.get(myId); if (!me) return;
  me.score++;
  me.vy += BOOST;
  if (me.vy > VY_MAX) me.vy = VY_MAX;
  pulse(me);
  $('score').textContent = me.score;
  const sy = H - GROUND_PAD - (me.worldY - viewWorldY);
  spawnPop(me.x, sy - R - 6);
}

addEventListener('pointerdown', e => {
  if (!running || mode !== 'mouse') return;
  if (e.target.closest('button,input')) return;
  localClick();
});
addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  e.preventDefault();
  if (running && mode === 'space' && !e.repeat) localClick();
});

function spawnPop(x, y) {
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = '+1';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.transform = 'translate(-50%,0)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

// --- View transitions ---
function hideAllUI() { for (const id of ['menu','mpMenu','lobby','over']) $(id).classList.add('hide'); }
function setBack(show) { $('back').style.display = show ? 'block' : 'none'; }

function showMenu() {
  view = 'menu'; hideAllUI(); $('menu').classList.remove('hide');
  setBack(false); hud.style.display = 'none'; hint.style.display = 'none';
  clearSpheres(); players.clear();
  if (ws) { ws.close(); ws = null; }
  isMP = false; running = false; document.body.style.cursor = 'default';
  stopRoomPoll();
  renderLocalBoard('board');
}
function showMpMenu() {
  view = 'mp'; hideAllUI(); $('mpMenu').classList.remove('hide');
  setBack(true);
  $('mpName').value = localStorage.getItem('cb_name') || '';
  $('mpError').textContent = '';
  startRoomPoll();
}
function showLobby(room) {
  view = 'lobby'; hideAllUI(); $('lobby').classList.remove('hide');
  setBack(true); updateLobby(room);
}
function updateLobby(room) {
  $('lobbyCode').textContent = room.code;
  $('lobbyCount').textContent = room.players.length;
  $('lobbyList').innerHTML = room.players.map(p =>
    `<div class="row${p.id===myId?' me':''}"><span class="dot" style="background:${p.color};color:${p.color}"></span><span class="name">${esc(p.name)}${p.id===room.hostId?' <span style="font-size:8px;color:rgba(255,255,255,0.5);letter-spacing:1px;margin-left:4px">HOST</span>':''}</span></div>`
  ).join('');
  const isHost = room.hostId === myId;
  $('hostStart').style.display = isHost ? 'block' : 'none';
  $('hostHint').style.display = isHost ? 'none' : 'block';
}

async function startGame() {
  view = 'playing'; hideAllUI(); setBack(false);
  clearSpheres();
  viewWorldY = 0; prevView = 0;
  if (!isMP) {
    players.clear();
    const me = { id:'me', name:($('name').value.trim()||'Player').slice(0,14), color:COLORS[0], slot:0, score:0, worldY:0, vy:0, isMe:true };
    me.x = sphereX(0);
    players.set('me', me); myId = 'me';
    localStorage.setItem('cb_name', me.name);
    localStorage.setItem('cb_mode', mode);
  } else {
    for (const p of players.values()) { p.score = 0; p.worldY = 0; p.vy = 0; p.x = sphereX(p.slot); }
  }
  for (const p of players.values()) makeSphereEl(p);
  for (const n of ['3','2','1','GO']) { count.textContent = n; count.style.display = 'block'; await sleep(550); }
  count.style.display = 'none';
  t = 10.0; running = true;
  $('score').textContent = '0';
  hud.style.display = 'flex';
  hint.textContent = mode === 'mouse' ? 'Click anywhere!' : 'Mash spacebar!';
  hint.style.display = 'block';
  document.body.style.cursor = mode === 'mouse' ? 'crosshair' : 'default';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function end() {
  running = false; hud.style.display = 'none'; hint.style.display = 'none';
  document.body.style.cursor = 'default';
  view = 'over'; hideAllUI(); $('over').classList.remove('hide'); setBack(true);
  const me = players.get(myId);
  const myScore = me ? me.score : 0;
  if (!isMP) {
    const name = me.name, at = Date.now();
    const all = JSON.parse(localStorage.getItem('cb_scores') || '[]');
    all.push({ name, score: myScore, mode, at });
    all.sort((a,b) => b.score - a.score);
    localStorage.setItem('cb_scores', JSON.stringify(all.slice(0, 50)));
    $('finalText').textContent = myScore;
    $('resultTag').textContent = `${myScore===1?(mode==='mouse'?'CLICK':'PRESS'):(mode==='mouse'?'CLICKS':'PRESSES')} · ${mode.toUpperCase()}`;
    $('overTitle').textContent = 'Live Leaderboard';
    renderLocalBoard('board2', { name, score: myScore, mode, at });
  } else {
    $('finalText').textContent = myScore;
    $('resultTag').textContent = 'CLICKS · MULTIPLAYER';
    $('overTitle').textContent = 'Final Standings';
    const list = [...players.values()].sort((a,b) => b.score - a.score);
    $('board2').innerHTML = list.map((p,i) =>
      `<div class="row${p.id===myId?' me':''}"><span class="rank">${i+1}</span><span class="dot" style="background:${p.color};color:${p.color}"></span><span class="name">${esc(p.name)}</span><span>${p.score}</span></div>`
    ).join('');
  }
  clearSpheres();
}

function renderLocalBoard(targetId, hl) {
  const scores = JSON.parse(localStorage.getItem('cb_scores') || '[]').slice(0, 10);
  const el = $(targetId);
  if (!scores.length) { el.innerHTML = '<div class="empty">No scores yet — be the first!</div>'; return; }
  el.innerHTML = scores.map((s, i) => {
    const me = hl && s.score === hl.score && s.name === hl.name && s.at === hl.at && s.mode === hl.mode;
    return `<div class="row${me?' me':''}"><span class="rank">${i+1}</span><span class="name">${esc(s.name)}</span><span class="mt${s.mode==='space'?' space':''}">${s.mode||'mouse'}</span><span>${s.score}</span></div>`;
  }).join('');
}
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function setMode(m) {
  mode = m;
  $('modeMouse').classList.toggle('active', m === 'mouse');
  $('modeSpace').classList.toggle('active', m === 'space');
  localStorage.setItem('cb_mode', m);
}
setMode(mode);

// --- Multiplayer (WebSocket) ---
// Click Battle is co-hosted on the snake.io Render service at the /cb path.
// HTTP API: /api/cb/rooms · WS: /cb
const SERVER_HTTP = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? `http://${location.hostname}:3000`
  : 'https://snake-io-fzk5.onrender.com';
const SERVER_WS = SERVER_HTTP.replace(/^http/, 'ws') + '/cb';

function connect(action, code, roomName) {
  if (ws) { try { ws.close(); } catch {} ws = null; }
  const name = ($('mpName').value.trim() || 'Player').slice(0, 14);
  localStorage.setItem('cb_name', name);
  $('mpError').textContent = 'Connecting…';
  try { ws = new WebSocket(SERVER_WS); }
  catch { $('mpError').textContent = 'Server offline — try Solo'; return; }
  ws.onopen = () => ws.send(JSON.stringify({ type: action, code, name, roomName }));
  ws.onmessage = ev => { try { handleMsg(JSON.parse(ev.data)); } catch {} };
  ws.onerror = () => { $('mpError').textContent = 'Server offline — Solo still works!'; };
  ws.onclose = () => {
    if (view === 'mp') $('mpError').textContent = $('mpError').textContent || 'Disconnected';
    if (view === 'lobby' || view === 'playing' || view === 'over') showMpMenu();
  };
}

// Room browser: poll the server's room list while user is on the multiplayer menu
let roomPoll = null;
function startRoomPoll() {
  stopRoomPoll();
  refreshRooms();
  roomPoll = setInterval(refreshRooms, 3000);
}
function stopRoomPoll() { if (roomPoll) { clearInterval(roomPoll); roomPoll = null; } }

async function refreshRooms() {
  const target = $('roomBrowser');
  if (!target) return;
  try {
    const res = await fetch(SERVER_HTTP + '/api/cb/rooms', { cache: 'no-store' });
    const rooms = await res.json();
    if (!rooms.length) { target.innerHTML = '<div class="empty">No active rooms — create one above!</div>'; return; }
    target.innerHTML = rooms.map(r => {
      const joinable = r.joinable;
      const stateLbl = r.state === 'lobby' ? '' : r.state === 'playing' ? '· Playing' : r.state === 'countdown' ? '· Starting' : '· Done';
      return `<div class="row">
        <span class="name" title="${esc(r.name)}">${esc(r.name)}</span>
        <span class="code-mini">${r.code}</span>
        <span class="count">${r.players}/${r.maxPlayers} ${stateLbl}</span>
        <button class="join-btn" data-code="${r.code}" ${joinable ? '' : 'disabled'}>${joinable ? 'JOIN' : '—'}</button>
      </div>`;
    }).join('');
    for (const btn of target.querySelectorAll('.join-btn')) {
      btn.addEventListener('click', () => {
        if (!btn.disabled) { stopRoomPoll(); connect('join', btn.dataset.code); }
      });
    }
  } catch {
    target.innerHTML = '<div class="empty">Server offline — Solo still works!</div>';
  }
}

function handleMsg(m) {
  if (m.type === 'error') { $('mpError').textContent = m.error; }
  else if (m.type === 'joined') { myId = m.selfId; isMP = true; syncPlayers(m.room); showLobby(m.room); }
  else if (m.type === 'room')   { syncPlayers(m.room); if (view === 'lobby') updateLobby(m.room); }
  else if (m.type === 'start')  { startGame(); }
  else if (m.type === 'tick')   {
    for (const ps of m.players) {
      const p = players.get(ps.id);
      if (p && !p.isMe) { p.score = ps.score; p.worldY += (ps.y - p.worldY) * 0.4; p.vy = ps.vy || 0; }
    }
  }
  else if (m.type === 'finished') { syncPlayers(m.room); end(); }
}

function syncPlayers(room) {
  for (const id of [...players.keys()]) if (!room.players.find(p => p.id === id)) players.delete(id);
  for (const ps of room.players) {
    let p = players.get(ps.id);
    if (!p) { p = { id: ps.id, score: ps.score || 0, worldY: 0, vy: 0, isMe: ps.id === myId }; players.set(ps.id, p); }
    p.name = ps.name; p.color = ps.color; p.slot = ps.slot; p.x = sphereX(p.slot);
  }
}

let lastSent = 0;
setInterval(() => {
  if (!isMP || !running || !ws || ws.readyState !== 1) return;
  const now = performance.now(); if (now - lastSent < 70) return; lastSent = now;
  const me = players.get(myId); if (!me) return;
  ws.send(JSON.stringify({ type: 'state', score: me.score, y: me.worldY, vy: me.vy }));
}, 70);

// --- Wire up ---
$('name').value = localStorage.getItem('cb_name') || '';
$('start').addEventListener('click', () => { isMP = false; startGame(); });
$('modeMouse').addEventListener('click', () => setMode('mouse'));
$('modeSpace').addEventListener('click', () => setMode('space'));
$('mpBtn').addEventListener('click', showMpMenu);
$('back').addEventListener('click', () => {
  if (view === 'mp') showMenu();
  else if (view === 'lobby' || view === 'over') showMenu();
});
$('createBtn').addEventListener('click', () => {
  stopRoomPoll();
  connect('create', null, $('mpRoomName').value.trim());
});
$('joinBtn').addEventListener('click', () => {
  const code = $('codeInput').value.trim().toUpperCase();
  if (code.length !== 4) { $('mpError').textContent = 'Code must be 4 characters'; return; }
  stopRoomPoll();
  connect('join', code);
});
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('hostStart').addEventListener('click', () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'start' })); });
$('again').addEventListener('click', () => {
  if (isMP && ws && ws.readyState === 1) {
    view = 'lobby'; hideAllUI(); $('lobby').classList.remove('hide'); setBack(true);
    for (const p of players.values()) p.score = 0;
  } else { startGame(); }
});
$('overBack').addEventListener('click', showMenu);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('start').click(); });
renderLocalBoard('board');
</script>
</body>
</html>
